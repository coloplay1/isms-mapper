<!doctype html>
<html lang="zh-Hant-TW">
<head>
<meta charset="utf-8">
<meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob:; font-src 'self'; connect-src 'none'; manifest-src 'self'; base-uri 'none'; form-action 'none'; object-src 'none'">
<meta name="referrer" content="no-referrer">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="description" content="依 ISO/IEC 27001:2022 設計的 ISMS 導入輔助工具：103 個情境案例搜尋、風險評鑑與 SoA 連動檢查、32 份 ISMS 文件範本、Excel 範本匯入與 SoA 匯出。資料只存在你的瀏覽器。">
<meta property="og:type" content="website">
<meta property="og:title" content="ISMS 條款對照台">
<meta property="og:description" content="依 ISO/IEC 27001:2022 設計的 ISMS 導入輔助工具：103 個情境案例搜尋、風險評鑑與 SoA 連動檢查、32 份 ISMS 文件範本、Excel 範本匯入與 SoA 匯出。資料只存在你的瀏覽器。">
<meta property="og:image" content="https://coloplay1.github.io/isms-mapper/docs/overview.png">
<meta name="theme-color" content="#0e5a6b">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Ccircle cx='16' cy='16' r='14' fill='none' stroke='%230e5a6b' stroke-width='3'/%3E%3Cpath d='M10 16.5l4 4 8-9' fill='none' stroke='%230e5a6b' stroke-width='3' stroke-linecap='round' stroke-linejoin='round'/%3E%3C/svg%3E">
<title>ISMS 條款對照台</title>
<link rel="stylesheet" href="css/app.css?v=1.13.1">
</head>
<body>

<header class="top">
  <div class="wrap">
    <div class="bar">
      <div class="brand"><span class="mark">27k</span>ISMS 條款對照台</div>
      <div class="proj">
        <label for="projSel" class="saved">專案</label>
        <select id="projSel"></select>
        <button class="btn" id="newBtn">＋ 新專案</button>
        <button class="btn themebtn" id="themeBtn" type="button" aria-label="切換深色模式"><span aria-hidden="true">☾</span><span class="tlabel">深色</span></button>
        <span class="saved" id="savedAt"></span>
      </div>
    </div>
    <nav class="tabs" role="tablist" id="tabs">
      <button role="tab" data-tab="home" aria-selected="true">首頁</button>
      <button role="tab" data-tab="overview" aria-selected="false">總覽</button>
      <button role="tab" data-tab="search">案例搜尋</button>
      <button role="tab" data-tab="risks">風險評鑑</button>
      <button role="tab" data-tab="annex">附錄 A 確認</button>
      <button role="tab" data-tab="clauses">條款 4–10</button>
      <button role="tab" data-tab="improve">改善追蹤</button>
      <button role="tab" data-tab="docs">文件範本</button>
      <button role="tab" data-tab="projects">專案管理</button>
    </nav>
  </div>
</header>

<main class="wrap">
  <div id="backupBanner" class="bkbanner" hidden></div>
  <div id="storeBanner" class="banner" hidden>這個瀏覽器目前無法自動儲存。請在「專案管理」匯出專案檔，下次再匯入。</div>
  <div id="sampleBanner" class="sbanner" hidden></div>
  <section id="view-home"></section>
  <section id="view-overview" hidden></section>
  <section id="view-search" hidden></section>
  <section id="view-risks" hidden></section>
  <section id="view-annex" hidden></section>
  <section id="view-clauses" hidden></section>
  <section id="view-improve" hidden></section>
  <section id="view-docs" hidden></section>
  <section id="view-projects" hidden></section>
</main>
<footer class="wrap">依 ISO/IEC 27001:2022（含 Amd 1:2024）結構整理。條款名稱與說明為本工具自行撰寫的摘要，不含標準原文；正式內容請參照取得授權的標準文件。</footer>

<div id="drawerHost"></div>
<datalist id="ownerList"></datalist>
<input type="file" id="importFile" accept=".json,application/json" hidden>
<input type="file" id="xlsxFile" accept=".xlsx,application/vnd.openxmlformats-officedocument.spreadsheetml.sheet" hidden>

<script src="vendor/write-excel-file.min.js?v=1.13.1"></script>
<script src="vendor/read-excel-file.min.js?v=1.13.1"></script>
<script src="js/data/controls.js?v=1.13.1"></script>
<script src="js/data/cases.js?v=1.13.1"></script>
<script src="js/data/rules.js?v=1.13.1"></script>
<script src="js/data/docs.js?v=1.13.1"></script>
<script src="js/core.js?v=1.13.1"></script>
<script src="js/workbook.js?v=1.13.1"></script>
<script src="js/cycle.js?v=1.13.1"></script>
<script src="js/guide.js?v=1.13.1"></script>
<script src="js/app.js?v=1.13.1"></script>
</body>
</html>
